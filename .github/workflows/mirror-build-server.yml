name: mirror-build-server

# Builds the Space Station 14 fork "Triad-Sector/Triad_Sector" server from source
# and publishes SS14.Server_linux-x64.zip as a GitHub Release.
# Drop this into a fork of Triad-Sector/Triad_Sector at
# .github/workflows/mirror-build-server.yml
#
# Adapted from the LHDocker sunrise mirror. Triad Sector specifics:
#   - upstream repo  = Triad-Sector/Triad_Sector
#   - BRANCH         = main  (NOT master — vanilla/Goob/sunrise all use master,
#                             this one does not. Every branch reference below is `main`.)
#   - .NET           = 10  (global.json pins sdk 10.0.100 as of 2026-08-16;
#                           always match the repo's global.json)
#   => the RUNTIME Docker image for these builds must be dotnet_10 to match.
#   - engine         = space-wizards/RobustToolbox submodule; we run the SS14
#                      submodule-dependency action to align it.
#   - solution       = SpaceStation14.slnx (new slnx format, no .sln at root).
#                      `dotnet restore` at repo root handles this fine — the build
#                      targets the Content.Packaging project directly, not the solution.
#   - Triad's own CI uses checkout@v7 / setup-dotnet@v5; we stay on v4 to match the
#     rest of the LHDocker mirrors. Bump together if one is ever forced forward.

on:
  schedule:
    - cron: '0 8 * * *'   # nightly 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mirror-build-server
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout upstream Triad_Sector main (+ engine submodules)
        uses: actions/checkout@v4
        with:
          repository: Triad-Sector/Triad_Sector
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: Resolve upstream version
        id: ver
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=server-$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Skip if this commit was already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} already exists - skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Match the upstream global.json. Triad Sector = .NET 10 as of 2026-08-16.
      # If a future exit-150 ".NET version" error appears, re-check global.json and bump this.
      - name: Setup .NET 10
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Aligns the RobustToolbox submodule, matching upstream CI behaviour.
      - name: Align engine submodule (SS14 dependency action)
        if: steps.check.outputs.exists == 'false'
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Build & package server (linux-x64)
        if: steps.check.outputs.exists == 'false'
        run: |
          set -e
          dotnet restore
          dotnet build Content.Packaging --configuration Release --no-restore /m
          dotnet run --project Content.Packaging server --platform linux-x64

      - name: List build output
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "--- release/ ---"; ls -la release/ 2>/dev/null || true

      - name: Publish GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # server packaging emits release/SS14.Server_linux-x64.zip
          f=$(ls release/SS14.Server_linux-x64.zip 2>/dev/null || ls release/*.zip | head -1)
          echo "Artifact: $f"
          gh release create "${{ steps.ver.outputs.tag }}" \
            -R "${{ github.repository }}" \
            -t "Triad Sector SS14 server ${{ steps.ver.outputs.tag }}" \
            -n "Automated server build of upstream Triad-Sector/Triad_Sector@${{ steps.ver.outputs.sha }} ($(date -u +'%Y-%m-%d %H:%M UTC'))" \
            --latest \
            "$f"

      - name: Mirror fork main = upstream main + this workflow
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Locate THIS workflow file by its own path rather than hardcoding the
          # name — the file may legitimately be saved under a different filename,
          # and a hardcoded `mirror-build-server.yml` makes this step fail with
          # "No such file" under `set -e`. GITHUB_WORKFLOW_REF looks like:
          #   owner/repo/.github/workflows/<file>.yml@refs/heads/main
          WF_REL="${GITHUB_WORKFLOW_REF%%@*}"      # strip @ref
          WF_REL="${WF_REL#*/}"; WF_REL="${WF_REL#*/}"   # strip owner/repo/
          echo "this workflow lives at: $WF_REL"

          tmp=$(mktemp -d)
          git clone --depth=1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$tmp/m"
          cd "$tmp/m"
          cp "$WF_REL" "$tmp/wf.yml"
          git config user.name "lhdocker-ci"
          git config user.email "ci@legionhosting.net"
          git remote add upstream https://github.com/Triad-Sector/Triad_Sector.git
          git fetch --depth=1 upstream main
          git checkout -B main upstream/main
          mkdir -p "$(dirname "$WF_REL")"
          cp "$tmp/wf.yml" "$WF_REL"
          git add "$WF_REL"
          git commit -m "mirror: upstream main + ci workflow [skip ci]"
          git push --force origin main
          echo "fork main now mirrors upstream main + workflow overlay"
